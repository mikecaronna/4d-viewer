<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D capture viewer</title>
<style>
  :root { --bg:#0b0b0c; --fg:#f2f2f0; --dim:#8d8d88; --line:#26262a; --accent:#7fd1c1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width:780px; margin:0 auto; padding:56px 16px 80px; }
  h1 { font-size:1.6rem; font-weight:600; margin:0 0 .3em; letter-spacing:-.01em; }
  .sub { color:var(--dim); margin:0 0 2.5em; }
  .scene { display:block; border:1px solid var(--line); border-radius:10px;
           padding:20px 22px; margin:0 0 14px; text-decoration:none; color:inherit;
           transition:border-color .15s, background .15s; }
  .scene:hover { border-color:var(--accent); background:#121214; }
  .scene b { display:block; font-size:1.1rem; margin-bottom:.15em; }
  .scene span { color:var(--dim); font-size:.92rem; }
  h2 { font-size:1rem; font-weight:600; margin:2.6em 0 .6em; }
  p, li { color:#d3d3cf; }
  li { margin-bottom:.35em; }
  code { background:#17171a; padding:1px 6px; border-radius:4px; font-size:.88em; }
  table { border-collapse:collapse; width:100%; margin:.6em 0 0; font-size:.93rem; }
  td { padding:5px 10px 5px 0; border-bottom:1px solid var(--line); color:#d3d3cf; }
  td:first-child { color:var(--dim); white-space:nowrap; width:42%; }
  footer { margin-top:3.5em; padding-top:1.4em; border-top:1px solid var(--line);
           color:var(--dim); font-size:.86rem; }
</style>
</head>
<body>
<div class="wrap">

  <h1>4D capture viewer</h1>


  <a class="scene" href="app/?lng=en&amp;cam=-1.3641,-0.5130,-9.8923,0.4428,-1.0699,0.7647&amp;load=../assets/skate_jump.sog4d">
    <b>Skateboard jump</b>
  </a>

  <a class="scene" href="app/?lng=en&amp;cam=37.2115,-1.2367,-40.3276,-1.9415,-0.8169,-1.0186&amp;load=../assets/nick_guitar.sog4d">
    <b>Guitar</b>
  </a>

  <a class="scene" href="app/?lng=en&amp;cam=-1.2178,0.1667,-8.8289,-0.3908,-0.0409,2.5588&amp;load=../assets/tim_drums.sog4d">
    <b>Drums</b>
  </a>

  <ul>
    <li>Drag to look around.</li>
    <li>Scroll to move in and out.</li>
    <li>The bar along the bottom scrubs through it.</li>
  </ul>

</div>
</body>
</html>
